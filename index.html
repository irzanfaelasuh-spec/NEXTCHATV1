<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1b1f24"><title>NEXCHAT</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="css/styles.css"></head><body>
<section id="auth"><form id="af" novalidate><div class="logo">N</div><h1>Hello</h1><p id="ap">Create your account here</p>
<input id="an" placeholder="Name / username" autocomplete="username" maxlength="20"><input id="ae" type="email" placeholder="Email" autocomplete="email"><input id="aw" type="password" placeholder="Password (min 6)" autocomplete="current-password">
<p id="aerr" class="err" role="alert"></p><button class="btn">Enter</button><button type="button" id="at" class="link">I already have an account</button></form></section>
<main id="app" hidden>
<aside id="lp"><header><button class="av" id="meav" aria-label="Profile"></button><h2 class="grow">Chats</h2><button id="addb" class="fab" data-i="plus" aria-label="Add contact"></button></header><input id="q" class="search" placeholder="Search"><ul id="cl"></ul>
<nav class="dock"><button id="d1" data-i="chat" aria-label="Chats"></button><button id="d2" data-i="plus" aria-label="Add contact"></button><button id="d3" data-i="user" aria-label="Profile"></button></nav></aside>
<section id="cp" class="idle"><div id="ph">Select a chat to start</div>
<header><button class="ib" id="back" data-i="back" aria-label="Back"></button><div class="av" id="cav"></div><div class="grow"><b id="cn"></b><small id="cs"></small></div><button class="ib" id="ca" data-i="phone" aria-label="Voice call"></button><button class="ib" id="cv" data-i="video" aria-label="Video call"></button></header>
<div id="ms"></div><div id="rb" hidden><div class="grow"><b></b><span></span></div><button id="rx" aria-label="Cancel reply">×</button></div>
<form id="cf"><input id="ci" placeholder="Type a message" autocomplete="off" maxlength="2000"><button class="send" data-i="send" aria-label="Send"></button></form></section></main>
<div id="mn" class="back" hidden><div class="sheet"><button data-a="reply">Reply</button><button data-a="copy">Copy</button><button data-a="me">Delete for me</button><button data-a="all" class="dng">Delete for everyone</button></div></div>
<div id="ad" class="back" hidden><form id="adf" class="sheet"><h3>Add contact</h3><input id="a1" placeholder="Short name" maxlength="20"><input id="a2" placeholder="Full name" maxlength="40"><input id="a3" placeholder="NEXCHAT number (8 digits)" inputmode="numeric" maxlength="8"><p id="aer" class="err"></p><button class="btn">Save</button><button type="button" id="ac" class="link">Cancel</button></form></div>
<div id="pf" class="back" hidden><div class="sheet"><div class="av big" id="pa"></div><h3 id="pn"></h3><small id="pu"></small><div class="row2"><b id="pnum"></b><button id="pcp" class="link">Copy number</button></div><small>Your password is never stored or shown. Firebase keeps only a hash.</small><button id="plo" class="btn">Log out</button><button id="pcl" class="link">Close</button></div></div>
<div id="inc" hidden><b id="inn"></b><span id="int"></span><div><button id="ir" class="rnd end" data-i="end" aria-label="Decline"></button><button id="ia" class="rnd ok" data-i="phone" aria-label="Accept"></button></div></div>
<div id="call" hidden data-type="audio"><video id="rv" autoplay playsinline></video><video id="lv" autoplay playsinline muted></video><div class="ctr"><h2 id="cn2"></h2><p id="cst"></p></div>
<div class="ctl"><button id="mu" class="rnd" data-i="mic" aria-label="Mute"></button><button id="cm" class="rnd" data-i="cam" aria-label="Camera"></button><button id="sw" class="rnd" data-i="sw" aria-label="Switch camera"></button><button id="hg" class="rnd end" data-i="end" aria-label="End call"></button></div></div>
<div id="load" hidden><div class="spin"></div></div><div id="toast" hidden role="status"></div>
<script type="module" src="js/app.js"></script></body></html>
